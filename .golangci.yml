version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - depguard
  settings:
    depguard:
      rules:
        # CON-003: the library does not log. Diagnostics are a return value,
        # a Stats counter, or a callback.
        no-logging:
          files: ["!$test"]
          deny:
            - pkg: log
              desc: "CON-003: the library must not log"
            - pkg: log/slog
              desc: "CON-003: the library must not log"
        # CON-005: FileSet may walk a log directory; nothing else may reach
        # the disk. A caller who hands New an io.Reader gets a parser that
        # opens nothing.
        no-filesystem:
          files:
            - "!$test"
            - "!**/source_file.go"
            - "!**/fileset_open.go"
            - "!**/parallel.go"
            - "!**/compress/**"
            - "!**/bench/**"
            - "!**/cmd/**"
          deny:
            - pkg: os
              desc: "CON-005: filesystem access belongs in the reader constructors"
            - pkg: path/filepath
              desc: "CON-005: filesystem access belongs in the reader constructors"
    govet:
      enable-all: true
      disable:
        # Field alignment is deliberately not enforced: Record's field order
        # follows the specification's §4.2 listing so it can be reviewed
        # against the spec line by line.
        - fieldalignment
    revive:
      rules:
        - name: exported
          # CON-006 caps the exported surface at 40 identifiers and VAL-007
          # requires a doc comment on every one of them.
          severity: error

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
