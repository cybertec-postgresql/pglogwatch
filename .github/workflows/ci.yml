name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # CON-001: the module must build without cgo everywhere.
  CGO_ENABLED: "0"

jobs:
  vet:
    name: vet and staticcheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Every module is linted even when an earlier one fails. They have
      # separate dependency graphs, and stopping at the first failure would
      # hide the others behind it -- which is what the old `for` loop did.
      fail-fast: false
      matrix:
        # Every go.mod in the repository. golangci-lint reads one module at a
        # time: `./...` does not cross a nested go.mod, so a single run at the
        # root covers the parser library and silently leaves the CLI, the
        # compression wrapper, pgremote and the bench harness unlinted.
        #
        # All five share the root .golangci.yml -- golangci-lint walks up from
        # its working directory to find one -- so the rules are the same
        # everywhere and there is no per-module config to drift.
        module: [".", "compress", "pgremote", "bench", "cmd/pglogwatch"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        working-directory: ${{ matrix.module }}
        # -stdmethods=false: see .golangci.yml for why Parser.Seek is exempt.
        run: go vet -stdmethods=false ./...
      # golangci-lint v2 is required: .golangci.yml is written to the v2 schema
      # (top-level `version`, `formatters`, `linters.settings`), which v1
      # rejects outright at `config verify`.
      #
      # `latest` tracks the newest release, so the rule set can change without
      # a commit here -- a revision that passed yesterday can fail today. That
      # is the accepted trade for not having to bump a pin by hand; when it
      # happens, fix the finding rather than reaching for a pin.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  test:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # `task test-race` walks every module; the runner has no task binary.
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The race detector needs cgo on some platforms; scope the override to
      # this step only so the build matrix still proves CGO_ENABLED=0 works.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: task test-race

  alloc:
    name: allocation gates (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # VAL-003 asks for 0 allocs/op on all four target platforms, and an
        # allocation is a property of the compiler and the architecture, not
        # of the source: escape analysis differs between amd64 and arm64, and
        # a syscall wrapper that allocates on Windows does not on Linux. A
        # gate that runs on one of the four proves the property on one of the
        # four, so each gets a runner of its own.
        include:
          - { target: linux/amd64, os: ubuntu-latest }
          - { target: linux/arm64, os: ubuntu-24.04-arm }
          - { target: darwin/arm64, os: macos-latest }
          - { target: windows/amd64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # PERF-001 / AC-011: these tests fail if steady-state parsing allocates.
      # Run them without -race, which perturbs allocation accounting.
      - run: go test -run 'TestAlloc' -count=1 ./...
      # VAL-003 in its own words: the benchmarks, with -benchmem, reporting
      # 0 allocs/op. TestAlloc covers the same code through testing.AllocsPerRun
      # and is the gate that fails; this step exists so that the number VAL-003
      # names is visible in the log of every run rather than reconstructed from
      # a passing test.
      - name: benchmark allocation report (VAL-003)
        run: go test -run '^$' -bench . -benchmem -benchtime 100x .

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # PKG-005, PLT-002, AC-022.
      - name: cross build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in . ./compress ./pgremote ./bench ./cmd/pglogwatch; do
            (cd "$m" && go build ./...) || exit 1
          done
      # go build compiles the packages; it does not compile their tests. A
      # test helper guarded by a build tag -- of which this repository has
      # several, since peak RSS is readable on Unix and not on Windows -- can
      # therefore break a platform without failing anything here, and surface
      # only when somebody runs the suite on it. go vet type-checks the test
      # files too, which is what makes the cross-build claim cover the whole
      # tree rather than the non-test half of it.
      - name: cross type-check, tests included
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # -stdmethods=false: see .golangci.yml for why Parser.Seek is exempt.
        run: |
          for m in . ./compress ./pgremote ./bench ./cmd/pglogwatch; do
            (cd "$m" && go vet -stdmethods=false ./...) || exit 1
          done
      # PKG-007: the purego fallback must stay compilable.
      - name: cross build (purego)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags purego ./...

  deps:
    name: dependency surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # PKG-002, CON-004, AC-021: no non-stdlib package in the root graph.
      - run: go test -run 'TestImports|TestAPI' -count=1 .
