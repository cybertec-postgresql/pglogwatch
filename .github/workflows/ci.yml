name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # CON-001: the module must build without cgo everywhere.
  CGO_ENABLED: "0"

jobs:
  vet:
    name: vet and staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        run: |
          for m in . ./compress ./pgremote ./bench ./cmd/pglogwatch; do
            (cd "$m" && go vet ./...) || exit 1
          done
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # The race detector needs cgo on some platforms; scope the override to
      # this step only so the build matrix still proves CGO_ENABLED=0 works.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: make test-race

  alloc:
    name: allocation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # PERF-001 / AC-011: these tests fail if steady-state parsing allocates.
      # Run them without -race, which perturbs allocation accounting.
      - run: go test -run 'TestAlloc' -count=1 ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # PKG-005, PLT-002, AC-022.
      - name: cross build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in . ./compress ./pgremote ./bench ./cmd/pglogwatch; do
            (cd "$m" && go build ./...) || exit 1
          done
      # PKG-007: the purego fallback must stay compilable.
      - name: cross build (purego)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags purego ./...

  deps:
    name: dependency surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # PKG-002, CON-004, AC-021: no non-stdlib package in the root graph.
      - run: go test -run 'TestImports|TestAPI' -count=1 .
