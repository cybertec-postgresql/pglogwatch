name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # CON-001: the module must build without cgo everywhere.
  CGO_ENABLED: "0"

jobs:
  vet:
    name: vet and staticcheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Every module is linted even when an earlier one fails. They have
      # separate dependency graphs, and stopping at the first failure would
      # hide the others behind it -- which is what the old `for` loop did.
      fail-fast: false
      matrix:
        # Every go.mod in the repository. golangci-lint reads one module at a
        # time: `./...` does not cross a nested go.mod, so a single run at the
        # root covers the parser library and silently leaves the CLI, the
        # compression wrapper, pgremote and the bench harness unlinted.
        #
        # All five share the root .golangci.yml -- golangci-lint walks up from
        # its working directory to find one -- so the rules are the same
        # everywhere and there is no per-module config to drift.
        module: [".", "compress", "pgremote", "bench", "cmd/pglogwatch"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        working-directory: ${{ matrix.module }}
        # -stdmethods=false: see .golangci.yml for why Parser.Seek is exempt.
        run: go vet -stdmethods=false ./...
      # v8 is the first action release that runs golangci-lint v2. .golangci.yml
      # is written to the v2 schema (top-level `version`, `formatters`,
      # `linters.settings`), which v1 rejects outright at `config verify`.
      # No `version:` input: the action then installs the latest v2 itself.
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ${{ matrix.module }}

  test:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # The race detector needs cgo on some platforms; scope the override to
      # this step only so the build matrix still proves CGO_ENABLED=0 works.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: make test-race

  alloc:
    name: allocation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # PERF-001 / AC-011: these tests fail if steady-state parsing allocates.
      # Run them without -race, which perturbs allocation accounting.
      - run: go test -run 'TestAlloc' -count=1 ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # PKG-005, PLT-002, AC-022.
      - name: cross build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in . ./compress ./pgremote ./bench ./cmd/pglogwatch; do
            (cd "$m" && go build ./...) || exit 1
          done
      # PKG-007: the purego fallback must stay compilable.
      - name: cross build (purego)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags purego ./...

  deps:
    name: dependency surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # PKG-002, CON-004, AC-021: no non-stdlib package in the root graph.
      - run: go test -run 'TestImports|TestAPI' -count=1 .
