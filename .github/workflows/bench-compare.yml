name: Comparative benchmark

on:
  schedule:
    # Weekly, per TST-009. Sunday early, so a Monday morning has fresh numbers
    # and a week of drift is visible before anyone quotes them.
    - cron: "23 4 * * 0"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      records:
        description: "Corpus size in records"
        required: false
        default: "5000000"

permissions:
  contents: read

jobs:
  compare:
    name: pglogwatch vs pgbadger vs pgweasel
    # The comparison is only meaningful on the pinned machine: PERF-024 and
    # PERF-025 are ratios against two other programs, and a shared runner
    # changes all three numbers unequally (INF-002, INF-003, SVC-002).
    runs-on: [self-hosted, pglogwatch-bench]
    timeout-minutes: 180
    env:
      PGLOGWATCH_BENCH_MACHINE: "1"
      PGLOGWATCH_BENCH_MACHINE_NAME: ${{ runner.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # The baselines are installed on the runner at PINNED versions (INF-003),
      # not installed here. A version that moved between runs would make a
      # change in the ratio unattributable, which is the one thing this job
      # exists to avoid.
      - name: Record the baseline versions
        run: |
          echo "pgbadger: $(pgbadger --version 2>&1 | head -1)"
          echo "pgweasel: $(pgweasel --version 2>&1 | head -1)"
          echo "perl:     $(perl --version | sed -n 2p)"

      - name: Generate the corpus
        run: make corpus RECORDS=${{ inputs.records || '5000000' }}

      - name: Run the comparison
        run: make bench-compare

      # Published as an artifact rather than committed. TST-009 asks for a
      # build artifact, and a results table checked into the repository would
      # accumulate one commit per week of numbers nobody reads.
      - name: Publish the results table
        uses: actions/upload-artifact@v4
        with:
          name: comparative-results-${{ github.sha }}
          path: |
            bench/RESULTS.md
            bench/corpus-v1.manifest
            bench/MACHINE.md
            bench/PGBADGER.md
          if-no-files-found: error

      - name: Summarise on the run page
        if: always()
        run: |
          if [ -f bench/RESULTS.md ]; then
            cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results table produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A release tag means the numbers are about to be published, so an unmet
      # threshold has to stop the release rather than appear in a report
      # nobody re-reads. VAL-010 allows a threshold to be missed; it does not
      # allow it to be missed quietly.
      - name: Fail a release tag on an unmet threshold
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if grep -q 'NOT MET' bench/RESULTS.md; then
            echo "::error::a PERF-024 or PERF-025 threshold was not met; VAL-010 requires the release notes to state the measured value, the cause and the remediation plan"
            grep -n 'NOT MET' bench/RESULTS.md
            exit 1
          fi
